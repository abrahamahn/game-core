name: Repair TypeScript Package Lint

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  repair:
    if: "${{ github.event.head_commit.message == 'ci: repair TypeScript package lint blocker' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Install TypeScript package dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile
      - name: Repair unused test action parameter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('typescript/tests/game-core.test.ts')
          source = path.read_text()
          old = '''    action: Readonly<Action>,\n    random: RandomSource,\n  ): GameTransition<State, Event, Outcome> {\n    void action;\n'''
          new = '''    _action: Readonly<Action>,\n    random: RandomSource,\n  ): GameTransition<State, Event, Outcome> {\n'''
          if source.count(old) != 1:
              raise SystemExit('expected exactly one lint-blocking action parameter')
          path.write_text(source.replace(old, new))
          PY
          rm .github/workflows/fix-game-core-test-lint.yml
          git diff --check
      - name: Validate publishable TypeScript package
        working-directory: typescript
        run: pnpm prepack
      - name: Commit and publish test-only repair
        run: |
          git config user.name 'Game Core Maintenance'
          git config user.email '48481888+abrahamahn@users.noreply.github.com'
          git add typescript/tests/game-core.test.ts .github/workflows/fix-game-core-test-lint.yml
          git diff --cached --check
          git commit -m 'test(typescript): satisfy current lint rule'
          test -z "$(git status --porcelain)"
          git push origin HEAD:main
